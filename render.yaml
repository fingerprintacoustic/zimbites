services:
  - type: web
    name: zimbites-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: zimbites
      - key: OAUTH_SERVER_URL
        value: http://localhost:3000
      - key: BETA_ACCESS_CODE
        value: zimtest123
      - key: OWNER_OPEN_ID
        value: admin-demo-001
      - key: APP_ID
        value: zimbites-app
