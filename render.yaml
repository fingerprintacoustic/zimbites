services:
  - type: web
    name: zimbites
    env: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/trpc/system.health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: zimbites
      - key: OAUTH_SERVER_URL
        value: https://zimbites.onrender.com
      - key: VITE_OAUTH_PORTAL_URL
        value: https://zimbites.onrender.com
      - key: BETA_ACCESS_CODE
        value: zimtest123
      - key: OWNER_OPEN_ID
        value: admin-demo-001
      - key: APP_ID
        value: zimbites
